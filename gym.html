<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>

'use strict';
// One HTML page. Supabase stores the record; this browser only displays it.
// GYM shows rows whose context.area is gym: one line per lift, the top weight
// of each day, with the reps of that set under each reading. It logs nothing
// itself; lifts arrive through the MCP. It shares BODY's sign-in.
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const displayName = value => value.replace(/_/g,' ');
const stamp = value => new Date(value).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
const seriesKey = row => JSON.stringify([row.metric,row.unit || '']);
const sourceName = source => ({pad:'Page',you:'You',manual:'Manual',claude:'MCP',shortcut:'Shortcut',photo:'Photo estimate'}[source] || source);
const dayOf = value => { const d=new Date(value); return [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-'); };
const repsOf = row => Number.isInteger(row.context?.reps) && row.context.reps>0 ? row.context.reps : null;
let client = null, authSubscription = null, user = null, lifts = new Map(), generation = 0, request = 0, busy = false, historySignature = '';
let connectionPromise = null, authStorageCleanup = null;
function message(id,text,kind=''){ $(id).textContent = text; $(id).className = 'message' + (kind ? ' '+kind : ''); }
function projectConfig(value){
  const url = typeof value?.url==='string'?value.url.trim().replace(/\/$/,''):'', key = typeof value?.key==='string'?value.key.trim():'';
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url) || !/^sb_publishable_[A-Za-z0-9_-]+$/.test(key)) throw new Error('This page needs its Supabase connection set up in Vercel.');
  return {url,key};
}
async function connectDatabase(){
  if(client)return client;
  if(connectionPromise)return connectionPromise;
  connectionPromise=(async()=>{
    let response;
    try{ response=await fetch('/api/config',{cache:'no-store'}); }
    catch{ throw new Error('Could not connect. Check your internet connection and try signing in again.'); }
    if(!response.ok)throw new Error('This page needs its Supabase connection set up in Vercel.');
    let config;
    try{ config=projectConfig(await response.json()); }
    catch{ throw new Error('This page needs its Supabase connection set up in Vercel.'); }
    return makeClient(config);
  })();
  try{return await connectionPromise;}finally{connectionPromise=null;}
}
function showConnection(){ $('connection-dialog').showModal(); $('email').focus(); }
$('connect-open').onclick = showConnection;
$('connect-close').onclick = () => { if(!busy)$('connection-dialog').close(); };
$('connection-dialog').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
function resetView(){
  historySignature=''; lifts=new Map(); $('lifts').innerHTML=''; $('gym-empty').hidden=false;
  $('empty-title').textContent='One lift starts your line.'; $('empty-copy').textContent=user?'Log your first lift. Each session adds a point here.':'Sign in to see your lifts.';
  $('lift-count').textContent='—'; $('lift-meta').textContent='recorded'; $('gym-state').textContent='Start with a lift.';
  $('retry-read').hidden=true; message('history-message','');
}
function setUser(next){
  if (next?.id === user?.id) return;
  user=next; generation++; request++; resetView();
  $('connect-open').hidden=!!user; $('sign-out').hidden=!user;
  $('connection-status').textContent=user ? 'Connected' : 'Your record';
  $('connection-status').classList.toggle('connected',!!user);
  if (user) loadHistory();
}
function makeClient(config){
  if (!window.supabase) throw new Error('The connection library could not load. Check your internet connection and reload.');
  // The same key BODY uses, so one sign-in opens both pages on this site.
  const storageKey='wire-starter.auth.'+new URL(config.url).hostname;
  const storage=persistentAuthStorage(storageKey);
  authSubscription?.unsubscribe(); client?.auth.stopAutoRefresh(); authStorageCleanup?.();
  client=supabase.createClient(config.url,config.key,{auth:{storage,storageKey,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const thisClient=client;
  authSubscription=client.auth.onAuthStateChange((_event,session) => {
    setTimeout(() => {
      if(client!==thisClient)return;
      try{setUser(session && storage.getItem(storageKey)?session.user:null);}
      catch{setUser(null);message('history-message','Browser storage is blocked. Allow site data to stay signed in.','error');}
    },0);
  }).data.subscription;
  const storageChanged=event=>{
    if(client===thisClient && event.storageArea===storage && (event.key===storageKey || event.key===null) && event.newValue===null)setUser(null);
  };
  window.addEventListener('storage',storageChanged);
  authStorageCleanup=()=>window.removeEventListener('storage',storageChanged);
  return client;
}
function persistentAuthStorage(storageKey){
  const probe=storageKey+'.check.'+crypto.randomUUID(); let storage;
  try{
    storage=window.localStorage;storage.setItem(probe,'1');
    if(storage.getItem(probe)!=='1')throw new Error('Storage unavailable');
    storage.removeItem(probe);
    for(const key of [storageKey,storageKey+'-code-verifier',storageKey+'-user'])window.sessionStorage.removeItem(key);
    return storage;
  }catch{
    try{storage?.removeItem(probe);}catch{}
    throw new Error('Browser storage is blocked. Allow site data to stay signed in.');
  }
}
$('connect-form').addEventListener('submit',async event => {
  event.preventDefault(); if (busy) return;
  busy=true; $('connect-submit').disabled=true; message('connect-message','Signing in…');
  try {
    const db=await connectDatabase(); message('history-message','');
    const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if (error) throw error;
    if (!data.user) throw new Error('Sign-in did not return a user. Please try again.');
    $('password').value='';
    setUser(data.user); $('connection-dialog').close(); message('connect-message','');
  } catch(error){ message('connect-message',error.message || 'Could not sign in. Check your email and password.','error'); }
  finally { busy=false; $('connect-submit').disabled=false; }
});
$('sign-out').onclick=async () => {
  if (!client || busy) return;
  busy=true; $('sign-out').disabled=true;
  try {
    const {error}=await client.auth.signOut({scope:'local'});
    if(error) throw error;
    setUser(null);
  } catch(error){ message('history-message',error.message || 'Could not sign out. Please retry.','error'); }
  finally { busy=false; $('sign-out').disabled=false; }
};
// Read every page, even if the server caps a request below our requested size.
// A failed page throws; partial history is never presented as complete.
async function readAll(make){
  const all=[]; let from=0;
  for(;;){
    const {data,error,count}=await make().range(from,from+999);
    if(error) throw error;
    if(!Array.isArray(data) || !Number.isSafeInteger(count) || count<0) throw new Error('The full history could not be confirmed. Please retry.');
    all.push(...data); from+=data.length;
    if(from>=count) return all;
    if(!data.length) throw new Error('The history stopped before every reading was returned. Please retry.');
  }
}
async function loadHistory(){
  if (!client || !user) return false;
  const db=client, who=user.id, version=generation, thisRequest=++request;
  message('history-message','Loading your record…'); $('retry-read').hidden=true;
  try {
    const result=await readAll(() => db.from('events').select('id,metric,value::text,unit,occurred_at,recorded_at,source,event_type,context',{count:'exact'})
      .eq('user_id',who).eq('event_type','measurement')
      .order('recorded_at',{ascending:true}).order('id',{ascending:true}));
    if(version!==generation || thisRequest!==request) return false;
    const signature=JSON.stringify(result);
    if(signature===historySignature){ message('history-message',''); return true; }
    historySignature=signature;
    const rows=result.filter(row=>row.value!==null && row.context?.area==='gym');
    const previous=lifts; lifts=new Map();
    for(const row of rows){ const key=seriesKey(row); if(!lifts.has(key)) lifts.set(key,{key,rows:[],days:[],activePoint:-1}); lifts.get(key).rows.push(row); }
    for(const lift of lifts.values()){
      lift.rows.sort((a,b) => a.occurred_at.localeCompare(b.occurred_at) || a.id.localeCompare(b.id));
      // one point per day: the heaviest set that day. Ties keep the first set lifted.
      const byDay=new Map();
      for(const row of lift.rows){ const day=dayOf(row.occurred_at), top=byDay.get(day); if(!top || Number(row.value)>Number(top.value)) byDay.set(day,{...row,day,sets:0}); }
      for(const row of lift.rows) byDay.get(dayOf(row.occurred_at)).sets++;
      lift.days=[...byDay.values()]; lift.activePoint=previous.get(lift.key)?.activePoint ?? -1;
    }
    drawLifts(); message('history-message',''); return true;
  } catch(error){
    if(version!==generation || thisRequest!==request) return false;
    historySignature=''; lifts=new Map(); $('lifts').innerHTML=''; $('gym-empty').hidden=false;
    $('empty-title').textContent='Your record could not load.'; $('empty-copy').textContent='Retry to read your saved history.';
    $('lift-count').textContent='—'; $('gym-state').textContent='History unavailable';
    message('history-message',error.message || 'Could not load every reading.','error'); $('retry-read').hidden=false; return false;
  }
}
$('retry-read').onclick=()=>loadHistory();
function drawLifts(){
  const ordered=[...lifts.values()].sort((a,b)=>b.rows.at(-1).occurred_at.localeCompare(a.rows.at(-1).occurred_at));
  $('gym-empty').hidden=ordered.length>0;
  if(!ordered.length){ $('empty-title').textContent='One lift starts your line.'; $('empty-copy').textContent='Log your first lift. Each session adds a point here.'; $('lift-count').textContent='0'; $('lift-meta').textContent='recorded'; $('gym-state').textContent='Start with a lift.'; $('lifts').innerHTML=''; return; }
  $('lift-count').textContent=String(ordered.length); $('lift-meta').textContent=ordered.length===1?'lift recorded':'lifts recorded';
  const sessions=new Set(); for(const lift of ordered) for(const day of lift.days) sessions.add(day.day);
  $('gym-state').textContent=`Last lift ${stamp(ordered[0].rows.at(-1).occurred_at)}. ${sessions.size} training day${sessions.size===1?'':'s'}.`;
  $('lifts').innerHTML='';
  for(const lift of ordered){
    const node=$('lift-template').content.firstElementChild.cloneNode(true); lift.node=node; const first=lift.rows[0];
    node.querySelector('.lift-name').textContent=displayName(first.metric);
    node.setAttribute('aria-label',displayName(first.metric)+' history');
    node.querySelector('.history-subtitle').textContent=displayName(first.metric)+' · top weight per day · '+(first.unit || 'no unit recorded');
    node.querySelector('.record-count').textContent=lift.rows.length+' reading'+(lift.rows.length===1?'':'s')+' · '+lift.days.length+' day'+(lift.days.length===1?'':'s');
    node.querySelector('.records').innerHTML=[...lift.rows].reverse().map(row=>{ const reps=repsOf(row), point=lift.days.findIndex(day=>day.day===dayOf(row.occurred_at)); return `<button type="button" class="record" data-point="${point}" aria-label="Inspect ${escapeHTML(row.value)} ${escapeHTML(row.unit)}${reps?' for '+reps+' reps':''} recorded ${escapeHTML(stamp(row.occurred_at))}"><div class="record-value">${escapeHTML(row.value)}<span>${escapeHTML(row.unit)}</span></div><span class="record-reps">${reps?'× '+reps+' rep'+(reps===1?'':'s'):'reps not recorded'}</span><time datetime="${escapeHTML(row.occurred_at)}">${escapeHTML(stamp(row.occurred_at))}</time><small>${escapeHTML(sourceName(row.source))} · saved ${escapeHTML(new Date(row.recorded_at).toLocaleDateString([],{month:'short',day:'numeric'}))}</small></button>`; }).join('');
    node.querySelector('.records').addEventListener('click',event=>{ const row=event.target.closest('[data-point]'); if(row)inspectPoint(lift,Number(row.dataset.point)); });
    const plot=node.querySelector('.plot');
    plot.addEventListener('pointermove',event=>inspectPointer(lift,event)); plot.addEventListener('pointerdown',event=>inspectPointer(lift,event));
    plot.addEventListener('keydown',event=>{ if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return; event.preventDefault(); inspectPoint(lift,event.key==='Home'?0:event.key==='End'?lift.days.length-1:lift.activePoint+(event.key==='ArrowRight'?1:-1)); });
    $('lifts').appendChild(node);
    drawPlot(lift);
  }
}
// Compare decimal identities before converting them into chart coordinates.
function decimalIdentity(value){
  const match=String(value).trim().toLowerCase().match(/^([+-]?)(\d*)(?:\.(\d*))?(?:e([+-]?\d+))?$/);
  if(!match || !(match[2] || match[3])) return null;
  let digits=(match[2]+(match[3] || '')).replace(/^0+/,'');
  if(!digits) return '0';
  let exponent=Number(match[4] || 0)-(match[3] || '').length;
  while(digits.endsWith('0')){ digits=digits.slice(0,-1); exponent++; }
  return (match[1]==='-'?'-':'')+digits+'e'+exponent;
}
function drawPlot(lift){
  // Stored values stay exact strings. Never hide points that cannot be plotted.
  const plot=lift.node.querySelector('.plot'), candidates=lift.days;
  const W=Math.max(280,plot.clientWidth || 700),H=plot.clientHeight || 240,L=14,R=14,T=35,B=36;
  plot.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(candidates.some(row=>!Number.isFinite(Number(row.value)) || !Number.isFinite(Date.parse(row.occurred_at)) || decimalIdentity(row.value)!==decimalIdentity(String(Number(row.value))))){
    plot.innerHTML=`<text x="${W/2}" y="100" text-anchor="middle">This scale exceeds chart precision.</text><text x="${W/2}" y="120" text-anchor="middle">Exact saved values are listed below.</text>`;
    showPoint(lift,candidates.at(-1)); return;
  }
  if(lift.activePoint<0 || lift.activePoint>=candidates.length) lift.activePoint=candidates.length-1;
  let minimum=candidates[0],maximum=minimum;
  for(const row of candidates){ if(Number(row.value)<Number(minimum.value))minimum=row; if(Number(row.value)>Number(maximum.value))maximum=row; }
  const magnitude=Math.max(Math.abs(Number(minimum.value)),Math.abs(Number(maximum.value))) || 1;
  let low=Number(minimum.value)/magnitude,high=Number(maximum.value)/magnitude;
  const span=high-low, padding=span ? span*.16 : .1;
  low-=padding; high+=padding;
  const from=Date.parse(candidates[0].occurred_at),to=Date.parse(candidates.at(-1).occurred_at);
  const x=row=>from===to?W/2:L+(Date.parse(row.occurred_at)-from)/(to-from)*(W-L-R);
  const y=row=>T+(high-Number(row.value)/magnitude)/(high-low)*(H-T-B);
  let lines='',previous=null,hasGap=false,fills='',run=[];
  const finishRun=()=>{ if(run.length>1)fills+=`<path d="M${run[0].plotX} ${H-B} ${run.map(row=>'L'+row.plotX+' '+row.plotY).join(' ')} L${run.at(-1).plotX} ${H-B}Z" fill="url(#chart-wash)"/>`; run=[]; };
  for(const row of candidates){
    row.plotX=x(row); row.plotY=y(row);
    if(previous){
      // sessions are days apart by nature; a dashed span marks more than a week between them
      const gap=Date.parse(row.occurred_at)-Date.parse(previous.occurred_at)>7*86400000; hasGap ||= gap; if(gap)finishRun();
      lines+=`<path d="M${previous.plotX} ${previous.plotY}L${row.plotX} ${row.plotY}" fill="none" stroke="${gap?'#7e9b90':'#89ebcb'}" stroke-width="2"${gap?' stroke-dasharray="4 6"':''}/>`;
    }
    run.push(row); previous=row;
  }
  finishRun();
  const dateLabel=row=>new Date(row.occurred_at).toLocaleDateString([],{month:'short',day:'numeric'});
  const axisLabel=row=>String(row.value).length<=12?row.value:Number(row.value).toExponential(3);
  const repsLabel=row=>{ const reps=repsOf(row); return reps?`×${reps}`:''; };
  plot.innerHTML=`<defs><linearGradient id="chart-wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#89ebcb" stop-opacity=".13"/><stop offset="1" stop-color="#89ebcb" stop-opacity="0"/></linearGradient></defs>${fills}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#263b31"/><line x1="${L}" x2="${W-R}" y1="${(H-B+T)/2}" y2="${(H-B+T)/2}" stroke="#1f3029" stroke-dasharray="2 7"/><text x="${L}" y="12">${escapeHTML(axisLabel(maximum))}${minimum!==maximum?' / '+escapeHTML(axisLabel(minimum))+' range':''}</text>${hasGap?`<text x="${W-R}" y="12" text-anchor="end">— — over a week apart</text>`:''}${lines}${candidates.map((row,i)=>`<circle data-point="${i}" cx="${row.plotX}" cy="${row.plotY}" r="3.5" fill="#89ebcb"><title>${escapeHTML(row.value)} ${escapeHTML(row.unit)}${repsOf(row)?' × '+repsOf(row):''} · ${escapeHTML(stamp(row.occurred_at))}</title></circle>${repsOf(row)?`<text x="${row.plotX}" y="${Math.min(H-B-4,row.plotY+16)}" text-anchor="middle">${escapeHTML(repsLabel(row))}</text>`:''}`).join('')}<text x="${L}" y="${H-6}">${escapeHTML(dateLabel(candidates[0]))}</text>${from!==to?`<text x="${W-R}" y="${H-6}" text-anchor="end">${escapeHTML(dateLabel(candidates.at(-1)))}</text>`:''}<g class="plot-focus"></g>`;
  inspectPoint(lift,lift.activePoint);
}
function showPoint(lift,row){
  const reps=repsOf(row);
  lift.node.querySelector('.point-value').textContent=row.value; lift.node.querySelector('.point-unit').textContent=(row.unit || '')+(reps?' × '+reps:'');
  lift.node.querySelector('.point-time').textContent='Top set '+stamp(row.occurred_at)+(row.sets>1?' · '+row.sets+' sets that day':'');
}
function inspectPoint(lift,index){
  if(!lift.days.length) return; lift.activePoint=Math.max(0,Math.min(lift.days.length-1,index)); const row=lift.days[lift.activePoint]; showPoint(lift,row);
  lift.node.querySelectorAll('[data-point]').forEach(element=>{ if(element.tagName!=='circle')element.classList.toggle('active',Number(element.dataset.point)===lift.activePoint); });
  const focus=lift.node.querySelector('.plot-focus'); if(focus && row.plotX!=null) focus.innerHTML=`<circle class="focus-ring" cx="${row.plotX}" cy="${row.plotY}" r="5"/><circle cx="${row.plotX}" cy="${row.plotY}" r="3.5" fill="#b5fce3"/>`;
}
function inspectPointer(lift,event){
  if(!lift.days.length || lift.days[0].plotX==null) return; const matrix=lift.node.querySelector('.plot').getScreenCTM(); if(!matrix)return;
  const px=new DOMPoint(event.clientX,event.clientY).matrixTransform(matrix.inverse()).x;
  let nearest=0;for(let i=1;i<lift.days.length;i++) if(Math.abs(lift.days[i].plotX-px)<Math.abs(lift.days[nearest].plotX-px)) nearest=i;
  inspectPoint(lift,nearest);
}
let resizeFrame;
new ResizeObserver(()=>{ cancelAnimationFrame(resizeFrame); resizeFrame=requestAnimationFrame(()=>{ for(const lift of lifts.values()) if(lift.node && lift.days.length) drawPlot(lift); }); }).observe($('lifts'));
function refreshWhenVisible(){ if(document.visibilityState==='visible' && user && client && !busy) loadHistory(); }
document.addEventListener('visibilitychange',refreshWhenVisible);
setInterval(refreshWhenVisible,30000);

// Deployment provides public settings; restore this browser's remembered session.
(async()=>{
  try{
    const db=await connectDatabase(),version=generation;
    const {data,error}=await db.auth.getSession();if(error)throw error;
    if(client===db && version===generation)setUser(data.session?.user || null);
  }catch(error){message('history-message',error.message || 'Sign in to open your record.','error');}
})();

</script>
